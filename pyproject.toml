[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "piscript"
version = "1.0.0"
description = "Generate PostScript graphics with TeX-quality text rendering"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "neozhaoliang"}]
keywords = ["postscript", "tex", "graphics", "dvi", "vector-graphics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pygraphviz"]

[project.urls]
Repository = "https://github.com/neozhaoliang/piscript"

[tool.setuptools.packages.find]
where = ["."]
include = ["piscript", "piscript.*"]
