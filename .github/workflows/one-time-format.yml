name: One-time Python formatting
on:
  push:
    branches: [refactor/pythonic-core-20261009]
    paths: [.github/workflows/one-time-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pythonic-core-20261009
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.6,<1'
      - run: ruff format piscript tests
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add piscript tests
          if ! git diff --cached --quiet; then
            git commit -m 'style: format all Python sources with Ruff'
            git push origin HEAD:refactor/pythonic-core-20261009
          fi
